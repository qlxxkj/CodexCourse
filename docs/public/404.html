<!DOCTYPE html>
<html lang="zh-CN" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Codex Course</title>
  <script>
    (function() {
      var path = window.location.pathname;
      // Custom domain root -> redirect to CodexCourse subpath
      if (path === '/' || path === '') {
        var lang = navigator.language || navigator.userLanguage;
        if (lang.indexOf('zh') === 0) {
          window.location.replace('/CodexCourse/zh/');
        } else {
          window.location.replace('/CodexCourse/en/');
        }
      }
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=/CodexCourse/zh/">
  </noscript>
</head>
<body>
  <p>If not redirected, go to <a href="/CodexCourse/zh/">中文</a> or <a href="/CodexCourse/en/">English</a>.</p>
</body>
</html>
