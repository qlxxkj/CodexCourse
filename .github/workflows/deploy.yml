name: Deploy VitePress to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build VitePress
        run: npm run build
      - name: Fix asset paths for custom domain
        run: |
          # Replace /CodexCourse/ with / in all files (HTML, JS, JSON) for custom domain compatibility
          find docs/.vitepress/dist -type f \( -name "*.html" -o -name "*.js" -o -name "*.json" \) -exec sed -i 's|/CodexCourse/|/|g' {} +
      - name: Copy build output to root
        run: cp -r docs/.vitepress/dist/* .
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
